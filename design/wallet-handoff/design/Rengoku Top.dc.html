<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Cinzel:wght@500;600&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
@keyframes rgEmber{0%{transform:translate(0,0);opacity:0}10%{opacity:1}70%{opacity:.75}100%{transform:translate(var(--dx),var(--rise));opacity:0}}
@keyframes rgFlicker{0%{transform:scaleY(1) scaleX(1);opacity:.85}50%{transform:scaleY(1.08) scaleX(.97);opacity:1}100%{transform:scaleY(.95) scaleX(1.03);opacity:.8}}
@keyframes rgRise{0%{opacity:0;transform:translateY(46px) scale(.9);filter:blur(10px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:blur(0)}}
</style>
</helmet>
<div style="position:relative;width:100%;height:100%;overflow:hidden;background:#110805;color:#F6EAD6">
  <div style="position:absolute;inset:0;background:radial-gradient(80% 38% at 50% 104%,rgba(255,110,31,.42),rgba(179,18,27,.16) 45%,transparent 75%),radial-gradient(50% 30% at 50% 34%,rgba(255,138,31,.10),transparent 70%)"></div>
  <div style="position:absolute;left:0;right:0;bottom:-30px;height:34%;transform-origin:50% 100%;animation:rgFlicker 3.2s ease-in-out infinite alternate;background:radial-gradient(36% 70% at 50% 100%,rgba(255,177,61,.38),rgba(255,90,31,.14) 50%,transparent 78%)"></div>
  {{ embers }}
  <div style="position:absolute;inset:22px;border:1px solid rgba(255,200,61,.22);border-radius:30px;pointer-events:none"></div>
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:0 40px 52px">
    <div style="flex:1;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;animation:rgRise 1.6s cubic-bezier(.2,.8,.2,1) both">
      <svg width="112" height="112" viewBox="0 0 100 100" style="filter:drop-shadow(0 0 18px rgba(255,120,31,.45))">
        <defs>
          <linearGradient id="tpG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3B0"></stop><stop offset=".5" stop-color="#FFC83D"></stop><stop offset="1" stop-color="#D98A0A"></stop></linearGradient>
          <linearGradient id="tpF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD36A"></stop><stop offset=".5" stop-color="#FF6A24"></stop><stop offset="1" stop-color="#B3121B"></stop></linearGradient>
        </defs>
        <circle cx="50" cy="50" r="47" fill="none" stroke="url(#tpG)" stroke-width="1.2"></circle>
        <circle cx="50" cy="50" r="42.5" fill="none" stroke="url(#tpG)" stroke-width=".6" opacity=".7"></circle>
        <path d="M50 6C56 24 70 30 76 48 80 40 78 32 76 28 86 38 90 52 86 66 80 82 66 92 50 92 34 92 18 80 14 62 12 48 20 38 28 30 28 40 30 46 36 50 36 32 42 18 50 6Z" fill="url(#tpF)" transform="translate(50 52) scale(.56) translate(-50 -50)"></path>
        <path d="M50 42C55 52 63 56 63 68 63 78 57 85 50 85 43 85 37 78 37 68 37 60 43 56 45 50 46 56 48 58 50 60 49 54 49 48 50 42Z" fill="#FFE9A8" opacity=".9" transform="translate(50 52) scale(.56) translate(-50 -50)"></path>
        <path d="M50 2.5 L52 5 L50 7.5 L48 5 Z M50 92.5 L52 95 L50 97.5 L48 95 Z" fill="#FFC83D"></path>
      </svg>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
        <div style="font-family:'Cinzel',serif;font-weight:500;font-size:44px;letter-spacing:.22em;padding-left:.22em;line-height:1;background:linear-gradient(180deg,#FFF6DA,#F2C463 55%,#C8861A);-webkit-background-clip:text;background-clip:text;color:transparent">RENGOKU</div>
        <div style="display:flex;align-items:center;gap:12px;width:220px">
          <span style="flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,200,61,.7))"></span>
          <span style="width:5px;height:5px;transform:rotate(45deg);background:#FFC83D"></span>
          <span style="flex:1;height:1px;background:linear-gradient(90deg,rgba(255,200,61,.7),transparent)"></span>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:8px">
        <div style="font-family:'Zen Old Mincho',serif;font-weight:700;font-size:22px;letter-spacing:.18em;padding-left:.18em">心を燃やせ。</div>
        <div style="font-family:'Zen Old Mincho',serif;font-weight:500;font-size:13px;letter-spacing:.14em;padding-left:.14em;color:#BFA88F">仲間と、毎日を積み上げる。</div>
      </div>
    </div>
    <div style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:16px">
      <button style="height:62px;width:100%;border-radius:12px;border:1px solid #140A06;background:linear-gradient(180deg,#E8822E,#C8441A 55%,#8E1015);box-shadow:inset 0 0 0 1px rgba(255,222,150,.55),inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #0A0503,0 14px 26px rgba(150,40,10,.35);color:#FFF4E2;font-family:'Zen Old Mincho',serif;font-weight:700;font-size:18px;letter-spacing:.3em;padding-left:.3em;cursor:pointer;transition:transform 120ms,box-shadow 120ms" style-active="transform:translateY(4px);box-shadow:inset 0 0 0 1px rgba(255,222,150,.55),0 0 0 #0A0503,0 4px 10px rgba(150,40,10,.3);transition-duration:80ms">はじめる</button>
      <button style="height:56px;width:100%;border-radius:12px;border:1px solid rgba(255,200,61,.7);background:rgba(20,10,6,.55);box-shadow:inset 0 0 0 3px rgba(20,10,6,.9),inset 0 0 0 4px rgba(255,200,61,.22),0 4px 0 #0A0503;color:#F2C463;font-family:'Zen Old Mincho',serif;font-weight:700;font-size:16px;letter-spacing:.3em;padding-left:.3em;cursor:pointer;transition:transform 120ms,box-shadow 120ms" style-active="transform:translateY(4px);box-shadow:inset 0 0 0 3px rgba(20,10,6,.9),inset 0 0 0 4px rgba(255,200,61,.22),0 0 0 #0A0503;transition-duration:80ms">ログイン</button>
      <div style="text-align:center;font-family:'Zen Old Mincho',serif;font-size:11px;letter-spacing:.16em;color:#9C8670;margin-top:6px">招待制のチーム専用サイトです</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:800},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;seed&quot;:{&quot;editor&quot;:null,&quot;default&quot;:19,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    if (!(this.props.motion ?? true)) return { embers: null };
    const R = React.createElement; let x = this.props.seed ?? 19;
    const rnd = () => { x = (x * 9301 + 49297) % 233280; return x / 233280; };
    const kids = [];
    for (let i = 0; i < 16; i++) {
      const sz = 2 + rnd() * 3, dur = 7 + rnd() * 8, del = -rnd() * dur, left = rnd() * 100, dx = rnd() * 70 - 35, gold = rnd() > .6;
      kids.push(R('span', { key: i, style: { position: 'absolute', left: left + '%', bottom: '-10px', width: sz, height: sz, borderRadius: '50%', background: gold ? '#FFC83D' : '#FF8A1F', boxShadow: `0 0 ${sz*3}px ${sz*.8}px rgba(255,110,31,.5)`, animation: `rgEmber ${dur}s linear ${del}s infinite`, '--dx': dx + 'px', '--rise': '-1240px', opacity: 0 } }));
    }
    return { embers: R('div', { style: { position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none' } }, kids) };
  }
}
</script>
</body>
</html>
